<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Quiz Results — LearnTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/theme.css" />
  <script src="/js/notifications.js"></script>
  <script src="/js/auth-helper.js"></script>
</head>
<body class="antialiased text-gray-900 bg-gray-50">
  <!-- Header -->
  <header class="header-sticky bg-white" id="header">
    <nav class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="/landing.html" class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">LearnTrack</a>
      </div>
    </nav>
  </header>

  <main class="max-w-4xl mx-auto p-6">
    <!-- Loading State -->
    <div id="loading" class="text-center py-12">
      <div class="inline-block animate-spin rounded-full h-12 w-12 border-b-2 border-indigo-600 mb-4"></div>
      <p class="text-gray-600">Loading results...</p>
    </div>

    <!-- Results Container -->
    <div id="results-container" class="hidden space-y-6">
      <!-- Score Card -->
      <section class="bg-white rounded-2xl shadow-lg p-8 text-center">
        <div id="score-icon" class="w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center">
          <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
          </svg>
        </div>
        
        <h1 id="result-title" class="text-3xl font-bold mb-2">Quiz Completed!</h1>
        <p id="result-subtitle" class="text-gray-600 mb-6">Here are your results</p>

        <div class="flex items-center justify-center gap-8 mb-6">
          <div>
            <p class="text-sm text-gray-600 mb-1">Your Score</p>
            <p id="score-display" class="text-4xl font-bold text-indigo-600">0%</p>
          </div>
          <div class="h-16 w-px bg-gray-200"></div>
          <div>
            <p class="text-sm text-gray-600 mb-1">Points Earned</p>
            <p id="points-display" class="text-4xl font-bold text-gray-900">
              <span id="points-earned">0</span>/<span id="points-total">0</span>
            </p>
          </div>
        </div>

        <div id="pass-fail-badge" class="inline-block px-6 py-2 rounded-full text-sm font-semibold">
          <!-- Badge will be inserted here -->
        </div>
      </section>

      <!-- Answer Review -->
      <section class="bg-white rounded-2xl shadow-lg p-8">
        <h2 class="text-2xl font-bold mb-6">Answer Review</h2>
        
        <div id="answers-container" class="space-y-6">
          <!-- Answers will be dynamically inserted -->
        </div>
      </section>

      <!-- Statistics -->
      <section class="bg-white rounded-2xl shadow-lg p-8">
        <h2 class="text-2xl font-bold mb-6">Quiz Statistics</h2>
        
        <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
          <div class="bg-gray-50 rounded-lg p-4">
            <p class="text-sm text-gray-600 mb-1">Attempt Number</p>
            <p id="stat-attempt" class="text-2xl font-bold text-gray-900">1</p>
          </div>
          <div class="bg-gray-50 rounded-lg p-4">
            <p class="text-sm text-gray-600 mb-1">Time Spent</p>
            <p id="stat-time" class="text-2xl font-bold text-gray-900">0:00</p>
          </div>
          <div class="bg-gray-50 rounded-lg p-4">
            <p class="text-sm text-gray-600 mb-1">Submitted</p>
            <p id="stat-date" class="text-sm font-bold text-gray-900">-</p>
          </div>
          <div class="bg-gray-50 rounded-lg p-4">
            <p class="text-sm text-gray-600 mb-1">Status</p>
            <p id="stat-status" class="text-sm font-bold text-green-600">Graded</p>
          </div>
        </div>
      </section>

      <!-- Actions -->
      <section class="flex gap-4">
        <button id="retake-btn" class="flex-1 px-6 py-4 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-lg transition-all">
          Retake Quiz
        </button>
        <button id="back-to-course-btn" class="flex-1 px-6 py-4 border-2 border-gray-300 hover:bg-gray-50 text-gray-700 font-semibold rounded-lg transition-all">
          Back to Course
        </button>
      </section>
    </div>
  </main>

  <script>
    const API_BASE = 'http://localhost:5000';
    const params = new URLSearchParams(window.location.search);
    const attemptId = params.get('attemptId');
    const courseId = params.get('courseId');

    let attemptData = null;

    // Get token helper
    function getToken() {
      return window.AuthHelper ? window.AuthHelper.getToken() : 
             sessionStorage.getItem('token') || 
             sessionStorage.getItem('auth_token');
    }

    // Load results
    async function loadResults() {
      try {
        const token = getToken();
        if (!token) {
          window.location.href = '/signIn.html';
          return;
        }

        const response = await fetch(`${API_BASE}/api/quizzes/attempt/${attemptId}`, {
          headers: {
            'Authorization': `Bearer ${token}`
          }
        });

        if (!response.ok) {
          const error = await response.json();
          throw new Error(error.error || 'Failed to load results');
        }

        const { data } = await response.json();
        attemptData = data;
        
        displayResults(data);
        
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('results-container').classList.remove('hidden');

      } catch (err) {
        console.error('Load results error:', err);
        window.Notifications.error(err.message);
        setTimeout(() => {
          window.location.href = '/studentDashboard.html';
        }, 2000);
      }
    }

    // Display results
    function displayResults(data) {
      const quiz = data.course_quizzes;
      const percentage = parseFloat(data.percentage || 0);
      const passed = quiz.passing_score ? (percentage >= quiz.passing_score) : true;

      // Score display
      document.getElementById('score-display').textContent = percentage.toFixed(1) + '%';
      document.getElementById('points-earned').textContent = data.score;
      document.getElementById('points-total').textContent = data.max_score;

      // Pass/Fail badge
      const badgeEl = document.getElementById('pass-fail-badge');
      if (quiz.passing_score) {
        if (passed) {
          badgeEl.className = 'inline-block px-6 py-2 rounded-full text-sm font-semibold bg-green-100 text-green-700';
          badgeEl.textContent = '✓ Passed';
          document.getElementById('score-icon').className = 'w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center bg-green-100 text-green-600';
          document.getElementById('result-title').textContent = 'Congratulations!';
          document.getElementById('result-subtitle').textContent = `You passed the quiz with ${percentage.toFixed(1)}%`;
        } else {
          badgeEl.className = 'inline-block px-6 py-2 rounded-full text-sm font-semibold bg-red-100 text-red-700';
          badgeEl.textContent = '✗ Not Passed';
          document.getElementById('score-icon').className = 'w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center bg-red-100 text-red-600';
          document.getElementById('result-title').textContent = 'Keep Practicing';
          document.getElementById('result-subtitle').textContent = `You need ${quiz.passing_score}% to pass (you got ${percentage.toFixed(1)}%)`;
        }
      } else {
        badgeEl.className = 'inline-block px-6 py-2 rounded-full text-sm font-semibold bg-indigo-100 text-indigo-700';
        badgeEl.textContent = 'Completed';
        document.getElementById('score-icon').className = 'w-24 h-24 mx-auto mb-4 rounded-full flex items-center justify-center bg-indigo-100 text-indigo-600';
      }

      // Display answers
      displayAnswers(data.answers, quiz);

      // Statistics
      document.getElementById('stat-attempt').textContent = data.attempt_number;
      document.getElementById('stat-time').textContent = formatTime(data.time_spent || 0);
      document.getElementById('stat-date').textContent = new Date(data.submitted_at).toLocaleString();
      document.getElementById('stat-status').textContent = data.status === 'graded' ? 'Graded' : 'Pending';

      // Retake button
      if (!quiz.allow_retakes) {
        document.getElementById('retake-btn').classList.add('hidden');
      }
    }

    // Display answers
    function displayAnswers(answers, quiz) {
      const container = document.getElementById('answers-container');
      
      if (!answers || answers.length === 0) {
        container.innerHTML = '<p class="text-gray-500 text-center py-8">No answers recorded</p>';
        return;
      }

      container.innerHTML = answers.map((answer, index) => {
        const isCorrect = answer.is_correct;
        const borderColor = isCorrect ? 'border-green-500' : 'border-red-500';
        const bgColor = isCorrect ? 'bg-green-50' : 'bg-red-50';
        const iconColor = isCorrect ? 'text-green-600' : 'text-red-600';

        return `
          <div class="border-l-4 ${borderColor} ${bgColor} rounded-r-lg p-6">
            <div class="flex items-start gap-4">
              <div class="flex-shrink-0">
                ${isCorrect 
                  ? `<svg class="w-8 h-8 ${iconColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>`
                  : `<svg class="w-8 h-8 ${iconColor}" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>`
                }
              </div>
              <div class="flex-1">
                <h3 class="font-bold text-lg mb-3">${answer.question || quiz.question}</h3>
                
                <div class="space-y-2">
                  <div>
                    <p class="text-sm font-semibold text-gray-600 mb-1">Your Answer:</p>
                    <p class="text-gray-900">${formatAnswer(answer.selected_answer, quiz.options)}</p>
                  </div>
                  
                  ${!isCorrect && answer.correct_answer ? `
                    <div>
                      <p class="text-sm font-semibold text-gray-600 mb-1">Correct Answer:</p>
                      <p class="text-green-700 font-semibold">${formatAnswer(answer.correct_answer, quiz.options)}</p>
                    </div>
                  ` : ''}
                  
                  <div class="flex items-center gap-4 text-sm mt-3">
                    <span class="font-semibold">Points: ${answer.points_earned || 0}/${answer.max_points || quiz.points || 10}</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Format answer with option label
    function formatAnswer(answerKey, options) {
      if (!options || typeof options !== 'object') {
        return answerKey;
      }
      return options[answerKey] ? `${answerKey}. ${options[answerKey]}` : answerKey;
    }

    // Format time
    function formatTime(seconds) {
      const mins = Math.floor(seconds / 60);
      const secs = seconds % 60;
      return `${mins}:${secs.toString().padStart(2, '0')}`;
    }

    // Retake quiz
    document.getElementById('retake-btn')?.addEventListener('click', () => {
      if (attemptData && attemptData.quiz_id) {
        window.location.href = `/quizTake.html?id=${attemptData.quiz_id}&courseId=${courseId}`;
      }
    });

    // Back to course
    document.getElementById('back-to-course-btn')?.addEventListener('click', () => {
      if (courseId) {
        window.location.href = `/courseView.html?id=${courseId}`;
      } else {
        window.location.href = '/studentDashboard.html';
      }
    });

    // Initialize
    if (attemptId) {
      loadResults();
    } else {
      window.Notifications.error('No attempt specified');
      setTimeout(() => {
        window.location.href = '/studentDashboard.html';
      }, 2000);
    }
  </script>
</body>
</html>
