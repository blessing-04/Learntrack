<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Course - LearnTrack</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/theme.css" />
  <script src="/js/notifications.js"></script>
</head>
<body class="antialiased text-gray-900 bg-gray-50">
  <header class="header-sticky bg-white">
    <nav class="max-w-7xl mx-auto px-6 py-4">
      <div class="flex items-center justify-between">
        <a href="/landing.html" class="text-2xl font-bold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">
          LearnTrack
        </a>
        <div class="flex items-center gap-4">
          <a href="/studentDashboard.html" class="text-gray-700 hover:text-indigo-600 font-medium">My Courses</a>
          <button id="signout" class="px-4 py-2 rounded-lg bg-indigo-600 text-white font-semibold">Sign out</button>
        </div>
      </div>
    </nav>
  </header>

  <main class="max-w-5xl mx-auto p-6 space-y-6">
    <!-- Course Header -->
    <section class="hero-gradient rounded-2xl shadow-lg p-8 text-white">
      <h1 id="course-title" class="text-4xl font-bold mb-3">Loading...</h1>
      <p id="course-meta" class="text-white/90 text-lg"></p>
    </section>

    <!-- About This Course -->
    <section class="bg-white rounded-2xl shadow-lg p-6 border border-indigo-100">
      <div class="flex items-center gap-2 mb-3">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white text-xl">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
        </div>
        <h2 class="text-xl font-bold text-gray-900">About This Course</h2>
      </div>
      <p id="course-description" class="text-gray-700 leading-relaxed"></p>
    </section>

    <!-- Course Content -->
    <section class="bg-white rounded-2xl shadow-lg p-6 border border-indigo-100">
      <div class="flex items-center gap-2 mb-6">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-purple-500 to-pink-500 flex items-center justify-center text-white text-xl">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 10v6M2 10l10-5 10 5-10 5z"></path><path d="M6 12v5c3 3 9 3 12 0v-5"></path></svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Course Content</h2>
      </div>
      <div id="sections-container" class="space-y-4">
        <div class="text-center py-4 text-gray-500">Loading...</div>
      </div>
    </section>

    <!-- Final Exam Section -->
    <section class="bg-gradient-to-r from-yellow-50 to-orange-50 rounded-2xl shadow-lg p-6 border-2 border-yellow-300">
      <div class="flex items-center gap-2 mb-6">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-yellow-500 to-orange-500 flex items-center justify-center text-white text-xl">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 3v18l7-5 7 5V3H5z"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-yellow-900 flex items-center gap-2"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v18l7-5 7 5V3H5z"></path></svg> Final Exam</h2>
      </div>
      <div id="final-exam-container" class="space-y-3">
        <div class="text-center py-4 text-yellow-700">Loading...</div>
      </div>
    </section>

    <!-- Mini Quizzes Section -->
    <section class="bg-white rounded-2xl shadow-lg p-6 border border-green-100">
      <div class="flex items-center gap-2 mb-6">
        <div class="w-10 h-10 rounded-full bg-gradient-to-br from-green-500 to-emerald-500 flex items-center justify-center text-white text-xl">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
          </svg>
        </div>
        <h2 class="text-2xl font-bold text-gray-900">Practice Quizzes</h2>
      </div>
      <div id="quizzes-container" class="space-y-3">
        <div class="text-center py-4 text-gray-500">Loading quizzes...</div>
      </div>
    </section>
  </main>

  <!-- Content Viewer Modal -->
  <div id="viewer-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
    <div class="bg-white rounded-2xl p-6 max-w-5xl w-full mx-4 max-h-[90vh] overflow-y-auto">
      <div class="flex items-center justify-between mb-4">
        <h3 id="viewer-title" class="text-xl font-bold"></h3>
        <button id="close-viewer-btn" class="px-4 py-2 border rounded-lg hover:bg-gray-100">Close</button>
      </div>
      <div id="viewer-content" class="mt-4"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabaseClient.js"></script>
  <script src="/js/app.js"></script>
  <script>
    let courseId = null;
    let sections = [];

    // Sign out handler
    document.getElementById('signout')?.addEventListener('click', async () => {
      try {
        sessionStorage.clear();
        if (window.supabase) {
          await window.supabase.auth.signOut();
        }
        window.location.href = '/landing.html';
      } catch (err) {
        console.error('Sign out error:', err);
        sessionStorage.clear();
        window.location.href = '/landing.html';
      }
    });

    // Get course ID from URL
    const params = new URLSearchParams(window.location.search);
    courseId = params.get('id');

    if (!courseId) {
      window.Notifications.error('No course ID provided');
      setTimeout(() => {
        window.location.href = '/studentDashboard.html';
      }, 1000);
    } else {
      // Check enrollment and load course
      checkEnrollment().then(isEnrolled => {
        if (isEnrolled) {
          loadCourse();
        }
      });
    }

    // Check if user is enrolled
    async function checkEnrollment() {
      try {
        const token = sessionStorage.getItem('token');
        if (!token) {
          window.location.href = '/signIn.html';
          return false;
        }

        const response = await fetch('/api/enrollments/my-courses', {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) {
          return false;
        }

        const { data: enrollments } = await response.json();
        const isEnrolled = enrollments.some(e => e.course_id === courseId || e.course?.id === courseId);

        if (!isEnrolled) {
          window.Notifications.error('You are not enrolled in this course');
          setTimeout(() => {
            window.location.href = '/studentDashboard.html';
          }, 1500);
          return false;
        }

        return true;
      } catch (err) {
        console.error('Enrollment check error:', err);
        return false;
      }
    }

    // Load course details
    async function loadCourse() {
      try {
        const token = sessionStorage.getItem('token');
        const response = await fetch(`/api/courses/${courseId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Failed to load course');

        const { data: course } = await response.json();
        document.getElementById('course-title').textContent = course.title;
        document.getElementById('course-meta').textContent = `${course.category} • ${course.level}`;
        document.getElementById('course-description').textContent = course.description || 'No description available';

        await loadSections();
        await loadQuizzes();
        await loadFinalExam();
      } catch (err) {
        console.error('Failed to load course:', err);
        window.Notifications.error('Failed to load course');
      }
    }

    // Load course sections
    async function loadSections() {
      try {
        const token = sessionStorage.getItem('token');
        const response = await fetch(`/api/courses/${courseId}/outline`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Failed to load sections');

        const { data: sectionData } = await response.json();
        sections = sectionData || [];
        renderSections();
      } catch (err) {
        console.error('Failed to load sections:', err);
        document.getElementById('sections-container').innerHTML = '<div class="text-center py-4 text-red-500">Failed to load content</div>';
      }
    }

    // Render sections
    function renderSections() {
      const container = document.getElementById('sections-container');
      
      if (sections.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-gray-500">No content available yet</div>';
        return;
      }

      const gradients = [
        { bg: 'bg-gradient-to-r from-indigo-50 to-purple-50', badge: 'bg-gradient-to-br from-indigo-500 to-purple-500', border: 'border-indigo-200' },
        { bg: 'bg-gradient-to-r from-blue-50 to-cyan-50', badge: 'bg-gradient-to-br from-blue-500 to-cyan-500', border: 'border-blue-200' },
        { bg: 'bg-gradient-to-r from-purple-50 to-pink-50', badge: 'bg-gradient-to-br from-purple-500 to-pink-500', border: 'border-purple-200' },
        { bg: 'bg-gradient-to-r from-emerald-50 to-teal-50', badge: 'bg-gradient-to-br from-emerald-500 to-teal-500', border: 'border-emerald-200' },
        { bg: 'bg-gradient-to-r from-orange-50 to-rose-50', badge: 'bg-gradient-to-br from-orange-500 to-rose-500', border: 'border-orange-200' }
      ];

      container.innerHTML = sections.map((section, idx) => {
        const colors = gradients[idx % gradients.length];
        return `
        <div class="border-2 ${colors.border} rounded-xl overflow-hidden hover:shadow-lg transition-all">
          <div class="${colors.bg} px-6 py-4 border-b-2 ${colors.border}">
            <h3 class="font-bold text-lg flex items-center gap-3">
              <span class="${colors.badge} text-white w-10 h-10 rounded-full flex items-center justify-center text-sm shadow-md">${idx + 1}</span>
              <span class="text-gray-900">${section.title}</span>
            </h3>
            ${section.lessons && section.lessons.length > 0 ? `
              <p class="text-sm text-gray-600 mt-1 ml-13">${section.lessons.length} lesson${section.lessons.length !== 1 ? 's' : ''}</p>
            ` : ''}
          </div>
          <div class="divide-y bg-white">
            ${section.lessons && section.lessons.length > 0 ? section.lessons.map((lesson, lessonIdx) => `
              <button onclick='viewLesson(${JSON.stringify(lesson)})' class="w-full px-6 py-4 text-left hover:bg-indigo-50 transition flex items-center justify-between group">
                <div class="flex items-center gap-4">
                  <span class="text-3xl">${lesson.video_url ? '📹' : lesson.resource_urls && lesson.resource_urls.length > 0 ? '📄' : '🔗'}</span>
                  <div>
                    <p class="font-medium text-gray-900 group-hover:text-indigo-600 transition">${lesson.title}</p>
                    <p class="text-xs text-gray-500 mt-1">
                      ${lesson.video_url ? 'Video Lesson' : lesson.resource_urls && lesson.resource_urls.length > 0 ? 'Document' : 'External Link'}
                    </p>
                  </div>
                </div>
                <svg class="w-5 h-5 text-gray-400 group-hover:text-indigo-600 transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
                </svg>
              </button>
            `).join('') : '<div class="px-6 py-4 text-sm text-gray-500 italic">No lessons yet</div>'}
          </div>
        </div>
      `;
      }).join('');
    }

    // Load quizzes for this course
    async function loadQuizzes() {
      try {
        const token = sessionStorage.getItem('token');
        const response = await fetch(`/api/quizzes/course/${courseId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Failed to load quizzes');

        const { data: quizzes } = await response.json();
        renderQuizzes(quizzes || []);
      } catch (err) {
        console.error('Failed to load quizzes:', err);
        document.getElementById('quizzes-container').innerHTML = '<div class="text-center py-4 text-gray-500">No quizzes available</div>';
      }
    }

    // Render quizzes (mini quizzes only)
    function renderQuizzes(quizzes) {
      const container = document.getElementById('quizzes-container');
      
      // Filter only mini quizzes
      const miniQuizzes = quizzes.filter(q => q.quiz_category === 'mini' || !q.quiz_category);
      
      if (miniQuizzes.length === 0) {
        container.innerHTML = '<div class="text-center py-8 text-gray-500">No practice quizzes available yet</div>';
        return;
      }

      container.innerHTML = miniQuizzes.map((quiz, idx) => {
        const hasTaken = quiz.user_attempts > 0;
        const bestScore = quiz.user_best_score;
        const passed = quiz.user_passed;
        const passingScore = quiz.passing_score;

        return `
          <div class="border-2 ${hasTaken && passed ? 'border-green-200 bg-green-50' : 'border-gray-200'} rounded-lg p-4 hover:shadow-lg transition-all">
            <div class="flex items-start justify-between">
              <div class="flex-1">
                <div class="flex items-center gap-3 mb-2">
                  <span class="w-8 h-8 rounded-full ${hasTaken && passed ? 'bg-green-500' : 'bg-indigo-500'} text-white flex items-center justify-center text-sm font-bold">
                    ${idx + 1}
                  </span>
                  <h3 class="font-bold text-gray-900">${quiz.question}</h3>
                </div>
                
                <div class="ml-11 space-y-1">
                  <div class="flex items-center gap-4 text-sm text-gray-600">
                    <span class="flex items-center gap-1">
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                      </svg>
                      ${quiz.points || 10} points
                    </span>
                    ${quiz.quiz_type ? `<span>• ${quiz.quiz_type.replace('_', ' ')}</span>` : ''}
                    ${passingScore ? `<span>• Pass: ${passingScore}%</span>` : ''}
                  </div>
                  
                  ${hasTaken ? `
                    <div class="flex items-center gap-2 text-sm">
                      <span class="font-semibold ${passed ? 'text-green-600' : 'text-orange-600'}">
                        Best Score: ${bestScore?.toFixed(1)}%
                      </span>
                      <span class="text-gray-500">• ${quiz.user_attempts} attempt${quiz.user_attempts !== 1 ? 's' : ''}</span>
                      ${passed ? '<span class="text-green-600 flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Passed</span>' : ''}
                    </div>
                  ` : ''}
                </div>
              </div>

              <div class="flex flex-col gap-2">
                <button onclick="takeQuiz('${quiz.id}')" class="px-4 py-2 ${hasTaken ? 'bg-orange-600 hover:bg-orange-700' : 'bg-indigo-600 hover:bg-indigo-700'} text-white rounded-lg font-semibold text-sm transition-colors">
                  ${hasTaken ? 'Retake Quiz' : 'Take Quiz'}
                </button>
                ${hasTaken ? `
                  <button onclick="viewQuizAttempts('${quiz.id}')" class="px-4 py-2 border border-gray-300 hover:bg-gray-50 text-gray-700 rounded-lg text-sm transition-colors">
                    View Attempts
                  </button>
                ` : ''}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    // Load final exam (multi-question exams system)
    async function loadFinalExam() {
      try {
        const token = sessionStorage.getItem('token');
        const response = await fetch(`/api/exams/course/${courseId}`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Failed to load final exam');

        const { data: exams } = await response.json();
        const finalExam = exams?.find(e => e.exam_type === 'final' && e.is_published);
        
        renderFinalExam(finalExam);
      } catch (err) {
        console.error('Failed to load final exam:', err);
        document.getElementById('final-exam-container').innerHTML = '<div class="text-center py-4 text-yellow-700">No final exam available</div>';
      }
    }

    // Render final exam (multi-question format)
    function renderFinalExam(finalExam) {
      const container = document.getElementById('final-exam-container');
      
      if (!finalExam) {
        container.innerHTML = '<div class="text-center py-8 text-yellow-700">No final exam available yet</div>';
        return;
      }

      const hasTaken = finalExam.attempt_count > 0;
      const bestScore = finalExam.best_percentage;
      const passed = bestScore >= (finalExam.passing_score || 75);

      container.innerHTML = `
        <div class="border-2 ${passed ? 'border-green-300 bg-green-50' : 'border-yellow-300 bg-white'} rounded-lg p-6 hover:shadow-lg transition-all">
          <div class="flex items-start justify-between">
            <div class="flex-1">
              <div class="flex items-center gap-3 mb-3">
                <span class="w-12 h-12 rounded-full ${passed ? 'bg-green-500' : 'bg-yellow-500'} text-white flex items-center justify-center">
                  <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 3v18l7-5 7 5V3H5z"></path></svg>
                </span>
                <div>
                  <h3 class="font-bold text-xl text-gray-900">${finalExam.title}</h3>
                  <p class="text-sm text-gray-600">${finalExam.description || `Pass with ${finalExam.passing_score || 75}%+ to earn a certificate`}</p>
                </div>
              </div>
              
              <div class="ml-15 space-y-2">
                <div class="flex items-center gap-4 text-sm text-gray-700">
                  <span class="flex items-center gap-1">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path>
                    </svg>
                    ${finalExam.question_count || 0} questions
                  </span>
                  <span>•</span>
                  <span>${finalExam.total_points || 100} points</span>
                  <span>• Passing: ${finalExam.passing_score || 75}%</span>
                  ${finalExam.time_limit ? `<span>• ${finalExam.time_limit} min</span>` : ''}
                </div>
                
                ${hasTaken ? `
                  <div class="flex items-center gap-2">
                    <span class="font-semibold ${passed ? 'text-green-600' : 'text-orange-600'} text-lg">
                      Best Score: ${bestScore?.toFixed(1)}%
                    </span>
                    <span class="text-gray-500 text-sm">• ${finalExam.attempt_count} attempt${finalExam.attempt_count !== 1 ? 's' : ''}</span>
                    ${passed ? '<span class="text-green-600 font-bold flex items-center gap-1"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Passed - Certificate Earned!</span>' : ''}
                  </div>
                ` : ''}
              </div>
            </div>

            <div class="flex flex-col gap-2">
              <button onclick="takeExam('${finalExam.id}')" class="px-6 py-3 ${passed ? 'bg-green-600 hover:bg-green-700' : 'bg-yellow-600 hover:bg-yellow-700'} text-white rounded-lg font-semibold text-sm transition-colors">
                ${hasTaken ? (passed ? 'Retake for Higher Score' : 'Retake Exam') : 'Take Final Exam'}
              </button>
              ${hasTaken ? `
                <button onclick="viewExamAttempts('${finalExam.id}')" class="px-6 py-3 border-2 ${passed ? 'border-green-300' : 'border-yellow-300'} hover:bg-gray-50 text-gray-700 rounded-lg text-sm transition-colors">
                  View Attempts
                </button>
              ` : ''}
              ${passed ? `
                <button onclick="viewCertificate()" class="px-6 py-3 bg-gradient-to-r from-yellow-400 to-orange-400 hover:from-yellow-500 hover:to-orange-500 text-white rounded-lg font-bold text-sm transition-colors shadow-lg flex items-center justify-center gap-2">
                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                  View Certificate
                </button>
              ` : ''}
            </div>
          </div>
        </div>
      `;
    }

    // View certificate (placeholder for now)
    window.viewCertificate = () => {
      window.Notifications.success('Certificate feature coming soon! You passed with 75%+');
      // TODO: Navigate to certificate page
    };

    // Take exam (multi-question)
    window.takeExam = (examId) => {
      window.location.href = `/examTake.html?id=${examId}&courseId=${courseId}`;
    };

    // View exam attempts
    window.viewExamAttempts = (examId) => {
      window.Notifications.info('Exam attempts view coming soon! Exam ID: ' + examId);
      // TODO: Show attempts modal or navigate to attempts page
    };

    // Take quiz (old single-question system - keep for compatibility)
    window.takeQuiz = (quizId) => {
      window.location.href = `/quizTake.html?id=${quizId}&courseId=${courseId}`;
    };

    // View quiz attempts
    window.viewQuizAttempts = async (quizId) => {
      try {
        const token = sessionStorage.getItem('token');
        const response = await fetch(`/api/quizzes/${quizId}/attempts`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (!response.ok) throw new Error('Failed to load attempts');

        const { data: attempts } = await response.json();
        
        if (attempts.length === 0) {
          window.Notifications.info('No attempts found');
          return;
        }

        // Show attempts in a simple alert for now (can be improved with a modal)
        const attemptsList = attempts.map((a, idx) => 
          `Attempt ${a.attempt_number}: ${a.percentage?.toFixed(1)}% (${a.status})`
        ).join('\n');
        
        alert(`Your Quiz Attempts:\n\n${attemptsList}`);
      } catch (err) {
        console.error('Failed to load attempts:', err);
        window.Notifications.error('Failed to load attempts');
      }
    };

    // View lesson
    window.viewLesson = (lesson) => {
      const modal = document.getElementById('viewer-modal');
      const titleEl = document.getElementById('viewer-title');
      const contentEl = document.getElementById('viewer-content');
      
      titleEl.textContent = lesson.title;
      
      if (lesson.video_url) {
        // Display video
        contentEl.innerHTML = `
          <video controls class="w-full max-h-[70vh] bg-black rounded-lg">
            <source src="${lesson.video_url}" type="video/mp4">
            Your browser does not support the video tag.
          </video>
          <div class="mt-3 p-3 bg-gray-50 rounded">
            <p class="text-sm text-gray-600">Video URL:</p>
            <a href="${lesson.video_url}" target="_blank" class="text-blue-600 hover:underline text-sm break-all">${lesson.video_url}</a>
          </div>
        `;
      } else if (lesson.resource_urls && lesson.resource_urls.length > 0) {
        const url = lesson.resource_urls[0];
        const isPDF = url.toLowerCase().includes('.pdf');
        
        if (isPDF) {
          // Embed PDF
          contentEl.innerHTML = `
            <iframe src="${url}" class="w-full h-[70vh] border rounded-lg"></iframe>
            <div class="mt-3 p-3 bg-gray-50 rounded">
              <p class="text-sm text-gray-600">Document URL:</p>
              <a href="${url}" target="_blank" class="text-blue-600 hover:underline text-sm break-all">${url}</a>
              <button onclick="window.open('${url}', '_blank')" class="ml-3 px-3 py-1 bg-blue-600 text-white rounded text-sm">Open in New Tab</button>
            </div>
          `;
        } else {
          // Display link or document download
          contentEl.innerHTML = `
            <div class="p-8 text-center border-2 border-dashed rounded-lg">
              <div class="text-6xl mb-4">${url.startsWith('http') ? '🔗' : '📄'}</div>
              <p class="text-lg font-semibold mb-2">${lesson.title}</p>
              <p class="text-gray-600 mb-4">Click below to open this ${url.startsWith('http') ? 'link' : 'document'}</p>
              <a href="${url}" target="_blank" class="inline-block px-6 py-3 bg-blue-600 text-white rounded-lg font-semibold hover:bg-blue-700">
                Open ${url.startsWith('http') ? 'Link' : 'Document'}
              </a>
              <div class="mt-4 p-3 bg-gray-50 rounded">
                <p class="text-sm text-gray-600 mb-1">URL:</p>
                <p class="text-sm break-all">${url}</p>
              </div>
            </div>
          `;
        }
      } else {
        contentEl.innerHTML = '<p class="text-gray-500">No content available</p>';
      }
      
      modal.classList.remove('hidden');
    };

    // Close viewer
    document.getElementById('close-viewer-btn').addEventListener('click', () => {
      document.getElementById('viewer-modal').classList.add('hidden');
    });

    // Close viewer on background click
    document.getElementById('viewer-modal').addEventListener('click', (e) => {
      if (e.target.id === 'viewer-modal') {
        document.getElementById('viewer-modal').classList.add('hidden');
      }
    });

    // Initialize
    document.addEventListener('DOMContentLoaded', async () => {
      const isEnrolled = await checkEnrollment();
      if (isEnrolled) {
        await loadCourse();
      }
    });
  </script>
</body>
</html>
